name: raffashe
description: "Portfólio"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.6
  velocity_x: ^4.2.1
  timelines: ^0.1.0
  font_awesome_flutter: ^10.7.0
  html: ^0.15.4
  url_launcher: ^6.3.0
  flutter_svg: ^2.0.10+1
  lucide_icons_flutter: ^3.1.10

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
flutter:
  generate: true

  uses-material-design: true
  assets:
    - assets/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-VariableFont_wght.ttf
